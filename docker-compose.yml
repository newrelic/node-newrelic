services:

  elasticsearch:
    container_name: nr_node_elastic
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:5856b2c77263336792b80fc0e03df42922b2f86a816a4daf23397fb02ef7b138 # v9.0.0
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Set cluster to single node
      - "discovery.type=single-node"
      # Disable high watermarks, used in CI as the runner is constrained on disk space
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "network.host=_site_"
      - "transport.host=127.0.0.1"
      - "http.host=0.0.0.0"
      # Disable password
      - "xpack.security.enabled=false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch:
    container_name: nr_node_opensearch
    image: opensearchproject/opensearch@sha256:3bfa1ec74d56928c2e018033d45c460ce2c0ea65a5cedd577de3102326c31b89 # v2.19.7 (tag: 2)
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Disable password
      - "DISABLE_SECURITY_PLUGIN=true"
      # Set cluster to single node
      - "discovery.type=single-node"
      # Disable high watermarks, used in CI as the runner is constrained on disk space
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "network.host=_site_"
      - "transport.host=127.0.0.1"
      - "http.host=0.0.0.0"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka setup based on the e2e tests in node-rdkafka. Needs both the
  # `zookeeper` and `kafka` services.
  zookeeper:
    container_name: nr_node_kafka_zookeeper
    image: confluentinc/cp-zookeeper@sha256:7610a50b13e7e9f6dc0dd00585ffdcb0bbed27392bef6b45791ef4087b2a746c # v7.9.1
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 1s
      timeout: 10s
      retries: 30
  kafka:
    container_name: nr_node_kafka
    image: confluentinc/cp-kafka@sha256:632e5f09affa3fe2a044da044ec4b40542a7aea5c48ac6eb13d42bc78ec9c9b5 # v7.9.1
    links:
      - zookeeper
    ports:
      - '9092:9092'
    healthcheck:
      test: /usr/bin/kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 1
      interval: 1s
      timeout: 60s
      retries: 60
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  memcached:
    container_name: nr_node_memcached
    image: memcached@sha256:aea0d81d101a9b64fe30cf2cf2f96144e284f8e9552bb084a03f4e12e9043bab # v1.6.45 (tag: latest)
    ports:
      - "11211:11211"
    healthcheck:
      # The memcached image is minimal (no shell utilities), but it ships a
      # bash that can open a TCP socket to verify the daemon is accepting
      # connections.
      test: ["CMD", "bash", "-c", "printf 'stats\\r\\nquit\\r\\n' > /dev/tcp/127.0.0.1/11211"]
      interval: 1s
      timeout: 10s
      retries: 30

  mongodb_5:
    container_name: nr_node_mongodb_5
    image: library/mongo@sha256:54bcd8da3ea5eec561b68c605046c55c6b304387dc4c2bf5b3a5f5064fbb7495 # v5.0.31 (tag: 5)
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--quiet"]
      interval: 1s
      timeout: 10s
      retries: 30

  mysql:
    container_name: nr_node_mysql
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    # We cannot use an image later than 8.3 because they have fully removed
    # the configuration option we need in order to switch back to the native
    # authentication method. We must use the native authentication method
    # because the `mysql` package does not support the `caching_sha2_password`
    # authentication method.
    image: mysql@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe # v8.3.0 (tag: 8.3)
    volumes:
      - "./docker/mysql:/etc/mysql/conf.d"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    healthcheck:
      test: ["CMD", "mysql" ,"-h", "mysql", "-P", "3306", "-u", "root", "-e", "SELECT 1"]
      interval: 1s
      timeout: 10s
      retries: 30

  redis:
    container_name: nr_node_redis
    image: redis@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848 # v8.10.3 (tag: latest)
    ports:
      - "6379:6379"
      - "6380:6380"
    command: >
      redis-server
      --tls-port 6380
      --tls-auth-clients no
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
    volumes:
      - "./docker/redis:/tls"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 10s
      retries: 30

  cassandra:
    container_name: nr_node_cassandra
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: cassandra@sha256:ae4cc2e4b62a5b2a2dd1645ba827cb50c589cc7531bcffe8b8b60ac3b1adc79d # v5.0.9 (tag: latest)
    ports:
      - "9042:9042"
    healthcheck:
      test: [ "CMD", "cqlsh", "-u cassandra", "-p cassandra"]
      interval: 5s
      timeout: 10s
      retries: 20

  pg:
    container_name: nr_node_postgres
    image: postgres@sha256:c712120f62628c9afce0152bc9e60a257e4e8ca3ab5c7c166dad2315e882cd06 # v9.2.23 (tag: 9.2)
    ports:
      - "5432:5432"
    healthcheck:
      # postgres:9.2 predates `pg_isready` (added in 9.3), so probe with psql.
      test: ["CMD", "psql", "-U", "postgres", "-c", "select 1"]
      interval: 1s
      timeout: 10s
      retries: 30

  pg_prisma:
    container_name: nr_node_postgres_prisma
    image: postgres@sha256:40e8c839f86c404f9bd1c456bb83f11b205f2cd95d753b34c2d074e89ecee786 # v15.19 (tag: 15)
    ports:
      - "5434:5434"
    environment:
      PGPORT: 5434
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 10s
      retries: 30

  rmq:
    container_name: nr_node_rabbit
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69 # v3.13.7-management (tag: 3-management)
    ports:
      - "5672:5672"
      - "15672:15672"
    # The Erlang VM auto-generates /var/lib/rabbitmq/.erlang.cookie on boot and
    # chmods it; on a loaded runner the distribution layer occasionally reads it
    # mid-write and crashes with "eacces" (BOOT FAILED). Pre-create the cookie
    # file with a static value and correct owner/mode *before* the server starts
    # so the read never races, then hand off to the normal entrypoint. The value
    # is arbitrary -- these are single-node test brokers that never cluster.
    #
    # Note: we are able to pre-create this file because, according to
    # https://web.archive.org/web/20260620031421/https://www.erlang.org/doc/system/distributed.html#security,
    # the contents are not necessarily unique to the running instance. It will
    # use an existing cookie if one exists, or create one if not.
    command:
      - bash
      - -c
      - >
        install -o rabbitmq -g rabbitmq -m 0400
        <(printf %s nr-node-test-cookie) /var/lib/rabbitmq/.erlang.cookie
        && exec docker-entrypoint.sh rabbitmq-server
    # Backstop: if a boot still fails transiently, restart rather than failing
    # the whole shard; the healthcheck retries below give it time to come up.
    restart: on-failure:3
    healthcheck:
      # `ping` only confirms the node is up; `check_port_connectivity` gates on
      # the AMQP listener actually accepting connections, which is what tests
      # need (the node reports up before the listener is ready).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 10s
      retries: 30
