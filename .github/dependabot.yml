version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      # Only open PRs for dev deps on a major release
      - dependency-type: "development"
        update-types: ["version-update:semver-major"]
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    # Keep GitHub Actions pinned by SHA up to date. Dependabot bumps the SHA
    # and updates the accompanying version comment when a new release ships.
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
