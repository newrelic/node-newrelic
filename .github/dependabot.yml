version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      # Dependabot does not have a way to blanket check deps in 0.x.x range
      # Start of 0.x.x deps
      # We are excluding `@newrelic/eslint-config` as we will manually update that one
      - dependency-name: "@apm-js-collab/tracing-hooks"
      - dependency-name: "@grpc/proto-loader"
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-http"
      - dependency-name: "@opentelemetry/otlp-exporter-base"
      - dependency-name: "@opentelemetry/otlp-transformer"
      - dependency-name: "@matteo.collina/tspl"
      - dependency-name: "@newrelic/newrelic-oss-cli"
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-proto"
      # End of 0.x.x deps
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    # Keep GitHub Actions pinned by SHA up to date. Dependabot bumps the SHA
    # and updates the accompanying version comment when a new release ships.
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
