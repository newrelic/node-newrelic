name: Benchmark Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Enable versioned runner quiet mode to make CI output easier to read:
  OUTPUT_MODE: quiet

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
    # This step can be removed when we drop support for Node 22
    - name: Upgrade npm
      if: matrix.node-version == '22.x'
      run: npm install -g npm@11
    - name: Install Dependencies
      run: npm install
    - name: Run Benchmark Tests
      env:
        NEW_RELIC_LICENSE_KEY: ${{ secrets.TEST_LICENSE }}
        BASE_REF: ${{ github.base_ref || 'main' }}
      run: node ./bin/run-bench.js --filename="${BASE_REF}_${{ matrix.node-version }}"
    - name: Verify Benchmark Output
      run: ls benchmark_results
    - name: Archive Benchmark Test
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-tests-${{ github.base_ref || 'main' }}-${{ matrix.node-version }}
        path: ./benchmark_results

