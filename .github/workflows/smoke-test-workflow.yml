name: Server Smoke Tests

permissions:
  contents: read

on:
  pull_request_target:
    types:
      - labeled
  # Run on pushes to any branch. Not triggered for forked repo PRs.
  push:
  schedule:
    # Run once a day at 9AM PDT (16 UTC) on mon-fri 
    # Last commit on default branch.
    # https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule
    - cron:  '0 16 * * 1-5'
  workflow_dispatch:

jobs:
  smoke:
    # Dependabot-authored branches/PRs cannot access repository secrets, so the
    # smoke tests (which require licensed/AWS secrets) would always fail. Skip
    # the job for Dependabot so the all-clear check can still pass.
    if: github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.label.name == 'force-smoke')
    permissions: read-all
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
    # This step can be removed when we drop support for Node 22
    - name: Upgrade npm
      if: matrix.node-version == '22.x'
      run: npm install -g npm@11
    - name: Install Dependencies
      run: npm install
    - name: Run Smoke Tests
      run: npm run smoke
      env:
        TEST_LICENSE: ${{ secrets.TEST_LICENSE }}
        LASP_LICENSE: ${{ secrets.LASP_LICENSE }}
        LASP_SECURE_LICENSE: ${{ secrets.LASP_SECURE_LICENSE }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

