name: Azure Site Extension

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Poll NPM for Release Availability"]
    types:
      - completed

env:
  SPEC_FILE_TEMPLATE: 'NewRelic.Azure.WebSites.Extension.NodeAgent.nuspec'

jobs:
  create_extension_bundle:
    runs-on: windows-latest
    if:
      (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')

    strategy:
      matrix:
        node-version: ['lts/*']
        arch: [ x64 ]

    permissions:
      contents: read
      # id-token must be set to `write` for OIDC publishing.
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dotnet '6.0.x'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '6.0.x'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          architecture: ${{ matrix.arch }}

      - name: Get workflow metadata
        id: workflow_meta
        run: |
          $version = jq -r '.version' ./package.json
          echo "agent_version=$version" >> $env:GITHUB_OUTPUT
          echo "pkg_filename=NewRelic.Azure.WebSites.Extension.NodeAgent.$version" >> $env:GITHUB_OUTPUT

      - name: Verify outputs # because we can't access step outputs until the next step
        env:
          AGENT_VERSION: ${{ steps.workflow_meta.outputs.agent_version }}
          PKG_FILENAME: ${{ steps.workflow_meta.outputs.pkg_filename }}
        run: |
          echo "Agent version: $env:AGENT_VERSION"
          echo "Package filename: $env:PKG_FILENAME"

      - name: Install agent
        working-directory: cloud-tooling/azure-site-extension/Content
        env:
          AGENT_VERSION: ${{ steps.workflow_meta.outputs.agent_version }}
        run: |
          npm i --prefix . "newrelic@$env:AGENT_VERSION"
          echo "Agent installed"

      - name: Configure package files
        working-directory: cloud-tooling/azure-site-extension
        env:
          AGENT_VERSION: ${{ steps.workflow_meta.outputs.agent_version }}
          PKG_FILENAME: ${{ steps.workflow_meta.outputs.pkg_filename }}
        run: |
          (Get-Content $env:SPEC_FILE_TEMPLATE).Replace('{VERSION}', "$env:AGENT_VERSION") | Set-Content "$env:PKG_FILENAME.nuspec"

      - name: Create bundle
        working-directory: cloud-tooling/azure-site-extension
        env:
          PKG_FILENAME: ${{ steps.workflow_meta.outputs.pkg_filename }}
        run: nuget pack "$env:PKG_FILENAME.nuspec"

      # This step is for us to check what's going to be published
      - name: Archive package for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-site-extension-test-${{ steps.workflow_meta.outputs.pkg_filename }}
          path: cloud-tooling/azure-site-extension/${{ steps.workflow_meta.outputs.pkg_filename }}.nupkg

      # Get a short-lived NuGet API key via OIDC authorization.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISH_POLICY_USER }}

      - name: Publish site extension
        working-directory: cloud-tooling/azure-site-extension
        env:
          PKG_FILENAME: ${{ steps.workflow_meta.outputs.pkg_filename }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ vars.NUGET_SOURCE }}
        run: |
          dotnet nuget push "$env:PKG_FILENAME.nupkg" --api-key $env:NUGET_API_KEY --source $env:NUGET_SOURCE
