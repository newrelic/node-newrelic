name: Agent Config Schema

permissions:
  contents: read

# Regenerates .fleetControl/schemas/config.json whenever main's config
# definition changes, then opens a PR with the result for a human to
# review and merge.
on:
  push:
    branches:
      - main
    paths:
      - 'lib/config/default.js'
      - 'lib/config/samplers.js'
      - '.fleetControl/schemaGeneration/**'

concurrency:
  group: agent-config-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate config schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Regenerate schema
        run: npm run generate:config-schema

      - name: Open schema update PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.NODE_AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          committer: ${{ vars.NODE_AGENT_CI_USER_NAME }} <${{ vars.NODE_AGENT_CI_USER_EMAIL }}>
          author: ${{ vars.NODE_AGENT_CI_USER_NAME }} <${{ vars.NODE_AGENT_CI_USER_EMAIL }}>
          add-paths: .fleetControl/schemas/config.json
          branch: regenerate-agent-config-schema-${{ github.run_id }}
          delete-branch: true
          base: main
          title: 'chore: regenerate agent config schema'
          commit-message: 'chore: regenerate agent config schema'
          body: |
            Auto-generated after ${{ github.sha }} changed the config
            definition on `main`.

            Regenerated by running `generate-schema.js` against the
            merged config. Review the schema diff before merging.

      - name: Summary
        if: steps.create-pr.outputs.pull-request-number
        run: |
          echo "Submitted PR #${{ steps.create-pr.outputs.pull-request-number }} to regenerate the agent config schema."
          echo "${{ steps.create-pr.outputs.pull-request-url }}"
