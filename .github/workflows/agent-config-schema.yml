name: Agent Config Schema

permissions:
  contents: read

# Regenerates .fleetControl/schemas/config.json whenever main's config
# schema changes, then opens a PR with the result for a human to
# review and merge. The PR branch name is fixed, so later runs update the
# open PR instead of opening a new one, and the PR is closed if the
# regenerated schema no longer differs from main.
on:
  push:
    branches:
      - main
    paths:
      - 'lib/config/schemas/**'
      - '!lib/config/schemas/README.md'
      - 'lib/config/samplers.js'
      - '.fleetControl/schemaGeneration/**'

concurrency:
  group: agent-config-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate config schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Regenerate schema
        run: npm run generate:config-schema

      - name: Open or update schema PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.NODE_AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          committer: ${{ vars.NODE_AGENT_CI_USER_NAME }} <${{ vars.NODE_AGENT_CI_USER_EMAIL }}>
          author: ${{ vars.NODE_AGENT_CI_USER_NAME }} <${{ vars.NODE_AGENT_CI_USER_EMAIL }}>
          add-paths: .fleetControl/schemas/config.json
          branch: agent-config-schema/auto-update
          delete-branch: true
          base: main
          title: 'chore: Regenerated agent config json schema'
          commit-message: 'chore: Regenerated agent config json schema'
          body: |
            Auto-generated because the config definition on `main` changed.

            Regenerated by running `generate-schema.js` against the latest
            `main`. This PR is updated in place whenever the config definition
            changes again, so it always reflects the current state of `main`.
            Review the schema diff before merging.

      - name: Summary
        env:
          PR_OPERATION: ${{ steps.create-pr.outputs.pull-request-operation }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          case "$PR_OPERATION" in
            created) echo "Opened PR #$PR_NUMBER to regenerate the agent config schema." ;;
            updated) echo "Updated PR #$PR_NUMBER with the regenerated agent config schema." ;;
            closed) echo "Regenerated schema matches main; closed the open schema PR and deleted its branch." ;;
            *)
              if [ -n "$PR_NUMBER" ]; then
                echo "PR #$PR_NUMBER is already up to date with the regenerated agent config schema."
              else
                echo "Regenerated schema matches main; no PR needed."
              fi
              ;;
          esac
          if [ -n "$PR_URL" ]; then echo "$PR_URL"; fi
