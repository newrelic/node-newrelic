name: Agent Release Lambda Layers and K8s Init Containers

# gh release create calls use NODE_AGENT_GH_TOKEN against other repos; GITHUB_TOKEN only needs read.
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Poll NPM for Release Availability"]
    types:
      - completed

jobs:
  release-tags:
    runs-on: ubuntu-latest
    if:
      (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
      - id: get_tag
        run: jq -r '"version=\(.version)"' ./package.json >> $GITHUB_OUTPUT
      - name: Create release tags for Lambda and K8s Init Containers
        run: |
          RELEASE_TITLE="New Relic Node Agent v${VERSION}.0"
          RELEASE_TAG="v${VERSION}.0_nodejs"
          RELEASE_NOTES="Automated release for [Node Agent v${VERSION}](https://github.com/newrelic/node-newrelic/releases/tag/v${VERSION})"
          gh auth login --with-token <<< $GH_RELEASE_TOKEN
          echo "newrelic/newrelic-lambda-layers - Releasing \"${RELEASE_TITLE}\" with tag ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" --title="${RELEASE_TITLE}" --repo=newrelic/newrelic-lambda-layers --notes="${RELEASE_NOTES}"
          echo "newrelic/newrelic-agent-init-container - Releasing \"${RELEASE_TITLE}\" with tag ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" --title="${RELEASE_TITLE}" --repo=newrelic/newrelic-agent-init-container --notes="${RELEASE_NOTES}"
        env:
          VERSION: ${{ steps.get_tag.outputs.version }}
          GH_RELEASE_TOKEN: ${{ secrets.NODE_AGENT_GH_TOKEN }}
