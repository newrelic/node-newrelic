name: Prepare Release PR

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      release_type:
        description: Type of release. patch or minor (major if breaking)
        type: string
        required: false
        default: patch
      changelog_file:
        description: Name of changelog file.
        type: string
        required: false
        default: NEWS.md
      changelog_json:
        description: Whether or not it should generate a changelog.json (should only be for node-newrelic)
        type: boolean
        required: false

jobs:
  generate-release-notes:
    # prepare-release.js uses GITHUB_TOKEN to push a release-notes branch and open a PR.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
    # Check out caller repo
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    # check out agent repo to agent-repo for the bin folders
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: newrelic/node-newrelic
        path: agent-repo
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        check-latest: true
    # Only need to install deps in agent-repo because of the bin scripts
    - name: Install Dependencies
      run: npm install --prefix agent-repo
    - name: Setup GitHub Credentials
      run: |
        git config user.name $GITHUB_ACTOR
        git config user.email gh-actions-${GITHUB_ACTOR}@github.com
    - name: Create Release Notes
      run: node ./agent-repo/bin/prepare-release.js --release-type "$RELEASE_TYPE" --branch "$BRANCH" --repo "$REPO" --changelog "$CHANGELOG_FILE" $CHANGELOG_JSON_FLAG
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
        BRANCH: ${{ github.ref }}
        REPO: ${{ github.repository }}
        CHANGELOG_FILE: ${{ inputs.changelog_file }}
        CHANGELOG_JSON_FLAG: ${{ inputs.changelog_json == true && '--changelog-json' || '' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
